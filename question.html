<div class="form-container">
    <h2>Website Feedback Form</h2>

    <form>

        <label>1. What was your first impression of the website?</label>
        <textarea rows="3"></textarea>

        <label>2. Was the website easy to use?</label>
        <select>
            <option>Yes</option>
            <option>No</option>
        </select>

        <label>3. How did this website help you?</label>
        <textarea rows="3"></textarea>

        <label>4. What problem did the website solve for you?</label>
        <textarea rows="3"></textarea>

        <label>5. Which feature did you find most useful?</label>
        <textarea rows="3"></textarea>

        <label>6. Was anything confusing?</label>
        <textarea rows="3"></textarea>

        <label>7. How did this website benefit you?</label>
        <textarea rows="3"></textarea>

        <label>8. Would you use this website again?</label>
        <select>
            <option>Yes</option>
            <option>No</option>
        </select>

        <label>9. Would you recommend it to others?</label>
        <select>
            <option>Yes</option>
            <option>No</option>
        </select>

        <label>10. What improvements would you suggest?</label>
        <textarea rows="3"></textarea>

        <button type="submit">Submit</button>

    </form>
</div>
